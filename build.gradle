import com.hypherionmc.modpublisher.properties.CurseEnvironment
import com.hypherionmc.modpublisher.properties.ModLoader

plugins {
    id "dev.architectury.loom" version "1.6+"
    id "maven-publish"
    id "com.hypherionmc.modutils.modpublisher" version "2.+"
}

base.archivesName = project.mod_name
version = "${project.mod_version}"
group = project.mod_group_id

loom {
    neoForge {
        accessTransformer(file("src/main/resources/META-INF/accesstransformer.cfg"))
    }
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = "${mod_id}.refmap.json"
    }
}

repositories {
    mavenLocal()
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    //mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    neoForge "net.neoforged:neoforge:${project.neo_version}"
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}")
}

processResources {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             cloth_config_version   : cloth_config_version]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    withSourcesJar()
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

publisher {
    apiKeys {
        modrinth System.getenv("MODRINTH_TOKEN")
        curseforge System.getenv("CURSEFORGE_TOKEN")
    }

    setCurseID("${project.curseforge_id}")
    setModrinthID("${project.modrinth_id}")
    setVersionType("release")
    setVersion("${project.version}")
    setDisplayName("${project.mod_name} ${project.version}")
    setGameVersions("1.20.2")
    setLoaders(ModLoader.NEOFORGE)
    setCurseEnvironment(CurseEnvironment.CLIENT)
    String artifact = "build/libs/${project.mod_name}-${project.mod_version}.jar"
    setArtifact(file(artifact))
    curseDepends { required("cloth-config") }
    modrinthDepends { required("cloth-config") }
    setChangelog("")
}

build.dependsOn remapJar